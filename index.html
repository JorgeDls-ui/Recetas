<style>
:root{
  --bg:#f4f1e6; --card:#fffdf7; --ink:#1d2a1b; --muted:#6a705f; --line:#e4dfcc;
  --accent:#2d5a2e; --accent-ink:#ffffff; --accent-soft:#e1ebd3;
  --g1:#2f6b2f; --g2:#7aa62e;
  --ok:#2f7d32; --ok-soft:#dcefdc; --warn:#8a5f00; --warn-soft:#fbefc9; --none-soft:#ece8d8;
  --t-D:#f3e7bf; --t-C:#dbe7c3; --t-L:#f6d9cf; --t-E:#d3dfd9;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --shadow:0 2px 10px rgba(30,45,25,.08);
}
:root[data-theme="light"]{color-scheme:light}
/* Tema oscuro: se activa al elegir "Oscuro", o en "Automático" cuando el sistema está en oscuro */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12160f; --card:#1b2117; --ink:#ecefe2; --muted:#a2a995; --line:#2b3324;
  --accent:#8fc463; --accent-ink:#10180a; --accent-soft:#26331c;
  --g1:#1f4a22; --g2:#4f7a1f;
  --ok:#8fd18f; --ok-soft:#1e3a20; --warn:#e6c15a; --warn-soft:#3a3010; --none-soft:#2a2c1c;
  --t-D:#4a4220; --t-C:#2f4122; --t-L:#4a2f29; --t-E:#26363a;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    color-scheme:dark;
    --bg:#12160f; --card:#1b2117; --ink:#ecefe2; --muted:#a2a995; --line:#2b3324;
    --accent:#8fc463; --accent-ink:#10180a; --accent-soft:#26331c;
    --g1:#1f4a22; --g2:#4f7a1f;
    --ok:#8fd18f; --ok-soft:#1e3a20; --warn:#e6c15a; --warn-soft:#3a3010; --none-soft:#2a2c1c;
    --t-D:#4a4220; --t-C:#2f4122; --t-L:#4a2f29; --t-E:#26363a;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font-family:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.serif{font-family:var(--serif)}

/* ---------- Inicio ---------- */
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 0 26px;border-radius:0 0 28px 28px}
.hero small{display:block;font-size:14px;opacity:.9}
.hero h1{font-family:var(--serif);font-size:28px;line-height:1.15;margin:4px 0 16px;font-weight:700}
.fake-search{width:100%;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);color:#5a6150;border:0;border-radius:14px;padding:13px 14px;font-size:15px;text-align:left;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#1f4a22,#2d5a2e);color:#fff;border-radius:20px;padding:18px 18px 16px;margin:18px 0 6px;box-shadow:var(--shadow)}
.banner .deco{position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.28;transform:rotate(-12deg);pointer-events:none}
.banner small{font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.banner h2{font-family:var(--serif);font-size:22px;line-height:1.2;margin:6px 0 6px;max-width:80%}
.banner p{margin:0 0 14px;font-size:14px;opacity:.92;max-width:80%}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#e5efd2;color:#1f3a1f;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:700}
.sec a{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;padding:0}
.cats{display:flex;gap:6px;justify-content:space-between}
.cat{flex:1;border:0;background:none;padding:0;cursor:pointer;text-align:center;font-size:12px;color:var(--ink)}
.cat .circ{width:62px;height:62px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:var(--shadow)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scroll-snap-type:x proximity;scroll-padding:0 16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.mini{flex:none;width:176px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;scroll-snap-align:start;position:relative;border:1px solid var(--line)}
.mini .pic{height:100px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative;padding-top:26px}
.mini .bd{padding:9px 11px 11px}
.mini h4{margin:0;font-size:14px;line-height:1.25;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.mini .meta{margin-top:4px}
.theme-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.theme-card p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.theme-card .chips{margin-top:0}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- Encabezados de pestañas ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 0 10px}
.top h1{font-family:var(--serif);font-size:24px;margin:0 0 10px;font-weight:700}
input[type=search]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none}
input[type=search]:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.row span{white-space:nowrap;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px;color:var(--muted)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
h2.cat-h{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 4px}

/* ---------- Tarjeta de lista ---------- */
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;box-shadow:var(--shadow);cursor:pointer}
.item .ico{flex:none;width:62px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.item .mid{flex:1;min-width:0}
.item h3{margin:0;font-size:16px;line-height:1.25;font-weight:650}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.miss{margin-top:5px;font-size:12.5px;color:var(--muted)}
.miss b{color:var(--ink);font-weight:600}
.badge{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;font-weight:650;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-part{background:var(--warn-soft);color:var(--warn)}
.b-none{background:var(--none-soft);color:var(--muted)}
.mini .badge{position:absolute;z-index:2;left:8px;top:8px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.heart{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);color:var(--muted);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.14)}
.heart.on{color:#d33a4a}
.mini .heart{position:absolute;right:8px;top:8px;width:32px;height:32px;font-size:16px}
.item .heart{box-shadow:none;background:transparent}

/* ---------- Detalle ---------- */
.detail{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.d-head{height:250px;display:flex;align-items:center;justify-content:center;font-size:104px;position:relative;padding-top:env(safe-area-inset-top)}
.d-btn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);width:42px;height:42px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center}
.d-back{left:16px}.d-fav{right:16px}.d-fav.on{color:#d33a4a}
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 16px calc(40px + env(safe-area-inset-bottom));max-width:760px;margin-left:auto;margin-right:auto}
.sheet h1{font-family:var(--serif);font-size:27px;line-height:1.15;margin:0 0 6px;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.stats{display:flex;margin:18px 0 6px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{flex:1;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.sheet h2{font-family:var(--serif);font-size:19px;margin:20px 0 8px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing li i{font-style:normal;width:22px;text-align:center;flex:none}
.ing .y i{color:var(--ok)}
.ing .n{color:var(--muted)}
.ing .n i{color:#c2493f}
.por p{margin:0 0 10px;font-size:15.5px}
.por .lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}

/* ---------- Navegación ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px 9px;font-size:11.5px;cursor:pointer}
nav button[aria-selected=true]{color:var(--accent);font-weight:700}
nav button span{display:block;font-size:21px;line-height:1.1;margin-bottom:2px}
</style>
</head>

":"Verduras"},{"id":"chayote","l":"Chayote","c":"Verduras"},{"id":"esparrago","l":"Espárragos","c":"Verduras"},{"id":"aguacate","l":"Aguacate","c":"Verduras"},{"id":"cebolla","l":"Cebolla","c":"Verduras"},{"id":"poblano","l":"Chile poblano","c":"Verduras"},{"id":"morron","l":"Pimiento / chile morrón","c":"Verduras"},{"id":"elote","l":"Elote","c":"Verduras"},{"id":"papa","l":"Papa","c":"Verduras"},{"id":"camote","l":"Camote","c":"Verduras"},{"id":"berenjena","l":"Berenjena","c":"Verduras"},{"id":"col","l":"Col morada","c":"Verduras"},{"id":"cilantro","l":"Cilantro","c":"Verduras"},{"id":"serrano","l":"Chile serrano","c":"Verduras"},{"id":"manzana","l":"Manzana","c":"Frutas"},{"id":"platano","l":"Plátano","c":"Frutas"},{"id":"fresa","l":"Fresas","c":"Frutas"},{"id":"naranja","l":"Naranja","c":"Frutas"},{"id":"mandarina","l":"Mandarina","c":"Frutas"},{"id":"uva","l":"Uvas","c":"Frutas"},{"id":"mango","l":"Mango","c":"Frutas"},{"id":"pera","l":"Pera","c":"Frutas"},{"id":"melon","l":"Melón","c":"Frutas"},{"id":"papaya","l":"Papaya","c":"Frutas"},{"id":"pina","l":"Piña","c":"Frutas"},{"id":"sandia","l":"Sandía","c":"Frutas"},{"id":"ciruela","l":"Ciruelas","c":"Frutas"},{"id":"durazno","l":"Duraznos","c":"Frutas"},{"id":"kiwi","l":"Kiwi","c":"Frutas"},{"id":"blueberry","l":"Blueberries","c":"Frutas"},{"id":"tort_maiz","l":"Tortillas de maíz","c":"Cereales y panes"},{"id":"tort_nopal","l":"Tortillas de nopal","c":"Cereales y panes"},{"id":"pan","l":"Pan integral / tostado","c":"Cereales y panes"},{"id":"pita","l":"Pan pita","c":"Cereales y panes"},{"id":"arabe","l":"Pan árabe","c":"Cereales y panes"},{"id":"thins","l":"Pan THINS","c":"Cereales y panes"},{"id":"tostada","l":"Tostadas deshidratadas","c":"Cereales y panes"},{"id":"salmas","l":"Salmas","c":"Cereales y panes"},{"id":"avena","l":"Avena","c":"Cereales y panes"},{"id":"harina_hot","l":"Harina para hotcakes","c":"Cereales y panes"},{"id":"granola","l":"Granola","c":"Cereales y panes"},{"id":"arroz","l":"Arroz","c":"Cereales y panes"},{"id":"pasta","l":"Espagueti / pasta","c":"Cereales y panes"},{"id":"quinoa","l":"Quinoa","c":"Cereales y panes"},{"id":"empaniz","l":"Empanizador","c":"Cereales y panes"},{"id":"frijoles","l":"Frijoles","c":"Otros"},{"id":"almendra","l":"Almendras","c":"Otros"},{"id":"nuez","l":"Nueces","c":"Otros"},{"id":"nuez_india","l":"Nueces de la india","c":"Otros"},{"id":"pistache","l":"Pistaches","c":"Otros"},{"id":"cacahuate","l":"Cacahuates","c":"Otros"},{"id":"crema_nuez","l":"Crema de cacahuate / almendras","c":"Otros"},{"id":"mazapan","l":"Mazapán","c":"Otros"},{"id":"chia","l":"Chía","c":"Otros"},{"id":"linaza","l":"Linaza","c":"Otros"}]}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var R = DATA.recs, ING = DATA.ings;
  var TIPOS = {D:'Desayuno', C:'Comida', L:'Colación', E:'Cena'};
  var TEMO = {D:'🍳', C:'🍽️', L:'🍎', E:'🥗'};
  var ORDER = {D:0, C:1, L:2, E:3};
  var CATS = ['Proteínas','Lácteos y quesos','Verduras','Frutas','Cereales y panes','Otros'];
  var LAB = {}; ING.forEach(function(i){ LAB[i.id] = i.l; });
  var BYID = {}; R.forEach(function(r){ BYID[r.id] = r; });

  var PRI = ['salmon','pescado','atun','pollo','res','molida','huevo','tort_maiz','tort_nopal','pita','arabe','thins','pan','tostada','avena','panela','oaxaca','requeson','cottage','yogurt'];
  var EM = {salmon:'🐟',pescado:'🐟',atun:'🐟',pollo:'🍗',res:'🥩',molida:'🥩',huevo:'🍳',tort_maiz:'🌮',tort_nopal:'🌮',pita:'🌯',arabe:'🌯',thins:'🥪',pan:'🥪',tostada:'🥙',avena:'🥣',panela:'🧀',oaxaca:'🧀',requeson:'🧀',cottage:'🧀',yogurt:'🥣',
    manzana:'🍎',platano:'🍌',fresa:'🍓',naranja:'🍊',mandarina:'🍊',uva:'🍇',mango:'🥭',pera:'🍐',melon:'🍈',papaya:'🍈',pina:'🍍',sandia:'🍉',kiwi:'🥝',blueberry:'🫐',durazno:'🍑',ciruela:'🍑',
    zanahoria:'🥕',pepino:'🥒',jicama:'🥕',betabel:'🥗',almendra:'🥜',nuez:'🥜',nuez_india:'🥜',pistache:'🥜',cacahuate:'🥜',proteina:'🥤',mazapan:'🍬',crema_nuez:'🥜'};

  function emoji(r){
    var n = r.n.toLowerCase();
    if(/hotcake|waffle/.test(n)) return '🥞';
    if(/taco/.test(n)) return '🌮';
    if(/pizza/.test(n)) return '🍕';
    if(/s[aá]ndwich/.test(n)) return '🥪';
    if(/ensalada/.test(n)) return '🥗';
    if(/ceviche/.test(n)) return '🍤';
    if(/omelette|huevo/.test(n)) return '🍳';
    if(/caldo/.test(n)) return '🍲';
    if(/licuado/.test(n)) return '🥤';
    if(/wrap|burrito/.test(n)) return '🌯';
    var ids = [];
    r.g.forEach(function(g){ g.forEach(function(i){ ids.push(i); }); });
    if(r.t === 'L'){
      for(var k = 0; k < ids.length; k++){ if(EM[ids[k]]) return EM[ids[k]]; }
    } else {
      for(var j = 0; j < PRI.length; j++){ if(ids.indexOf(PRI[j]) >= 0) return EM[PRI[j]]; }
    }
    return TEMO[r.t];
  }

  var pantry = {}, favs = {};
  var tab = 'H', tipo = 'T', query = '', solo = false, qIng = '', detailId = null;
  var KP = 'recetas_refri_v1', KF = 'recetas_favs_v1', KT = 'recetas_tema_v1';
  var theme = 'auto';
  try{ var st = localStorage.getItem(KT); if(st === 'light' || st === 'dark') theme = st; }catch(e){}

  function systemDark(){
    try{ return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; }
  }
  function updateMeta(){
    var dark = theme === 'dark' || (theme === 'auto' && systemDark());
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute('content', dark ? '#1f4a22' : '#2f6b2f');
  }
  function applyTheme(){
    var root = document.documentElement;
    if(theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
    updateMeta();
  }
  function setTheme(m){
    theme = m;
    try{ if(m === 'auto') localStorage.removeItem(KT); else localStorage.setItem(KT, m); }catch(e){}
    applyTheme();
    if(tab === 'H') renderHome();
  }
  try{
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if(mq){ if(mq.addEventListener) mq.addEventListener('change', updateMeta); else if(mq.addListener) mq.addListener(updateMeta); }
  }catch(e){}

  function loadSet(key, target){
    try{
      var s = localStorage.getItem(key);
      if(s){ JSON.parse(s).forEach(function(i){ target[i] = true; }); }
    }catch(e){}
  }
  function saveSet(key, obj){
    try{ localStorage.setItem(key, JSON.stringify(Object.keys(obj))); }catch(e){}
  }
  function pcount(){ return Object.keys(pantry).length; }
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }

  function score(r){
    var have = 0, miss = [];
    r.g.forEach(function(g){
      var ok = g.some(function(i){ return pantry[i]; });
      if(ok) have++; else miss.push(g.map(function(i){ return LAB[i]; }).join(' o '));
    });
    return {have:have, total:r.g.length, miss:miss};
  }

  function badge(s, hasP){
    if(!hasP) return null;
    var cls = s.have === s.total ? 'b-ok' : (s.have > 0 ? 'b-part' : 'b-none');
    var txt = s.have === s.total ? '¡Lista!' : ('Tienes ' + s.have + ' de ' + s.total);
    return el('span', 'badge ' + cls, txt);
  }

  function heartBtn(r){
    var b = el('button', 'heart' + (favs[r.id] ? ' on' : ''), favs[r.id] ? '♥' : '♡');
    b.setAttribute('aria-label', favs[r.id] ? 'Quitar de favoritas' : 'Agregar a favoritas');
    b.onclick = function(ev){ ev.stopPropagation(); toggleFav(r.id); };
    return b;
  }

  function toggleFav(id){
    if(favs[id]) delete favs[id]; else favs[id] = true;
    saveSet(KF, favs);
    refresh();
  }

  function compare(hasP){
    return function(a,b){
      if(hasP){
        var ra = a.s.have / a.s.total, rb = b.s.have / b.s.total;
        if(ra !== rb) return rb - ra;
        var ma = a.s.total - a.s.have, mb = b.s.total - b.s.have;
        if(ma !== mb) return ma - mb;
        if(a.s.have !== b.s.have) return b.s.have - a.s.have;
      } else if(ORDER[a.r.t] !== ORDER[b.r.t]) return ORDER[a.r.t] - ORDER[b.r.t];
      return a.r.n.localeCompare(b.r.n, 'es');
    };
  }

  // ---------- Tarjetas ----------
  function itemCard(x, hasP){
    var r = x.r, s = x.s;
    var card = el('div', 'item');
    var ico = el('div', 'ico', emoji(r));
    ico.style.background = 'var(--t-' + r.t + ')';
    card.appendChild(ico);
    var mid = el('div', 'mid');
    mid.appendChild(el('h3', null, r.n));
    mid.appendChild(el('div', 'meta', TIPOS[r.t] + ' · Plan ' + r.p));
    var b = badge(s, hasP);
    if(b){ b.style.marginTop = '5px'; mid.appendChild(b); }
    if(hasP && s.miss.length){
      var m = el('div', 'miss');
      m.appendChild(el('b', null, 'Te falta: '));
      m.appendChild(document.createTextNode(s.miss.join(', ')));
      mid.appendChild(m);
    }
    card.appendChild(mid);
    card.appendChild(heartBtn(r));
    card.onclick = function(){ openDetail(r.id); };
    return card;
  }

  function miniCard(x, hasP){
    var r = x.r, s = x.s;
    var card = el('div', 'mini');
    var pic = el('div', 'pic', emoji(r));
    pic.style.background = 'var(--t-' + r.t + ')';
    var b = badge(s, hasP);
    if(b) card.appendChild(b);
    card.appendChild(pic);
    card.appendChild(heartBtn(r));
    var bd = el('div', 'bd');
    bd.appendChild(el('h4', null, r.n));
    bd.appendChild(el('div', 'meta', TIPOS[r.t] + ' · Plan ' + r.p));
    card.appendChild(bd);
    card.onclick = function(){ openDetail(r.id); };
    return card;
  }

  function scored(){ return R.map(function(r){ return {r:r, s:score(r)}; }); }

  // ---------- Inicio ----------
  function renderHome(){
    var box = $('homeBody');
    box.textContent = '';
    var hasP = pcount() > 0;
    var all = scored();
    var ready = all.filter(function(x){ return x.s.have === x.s.total; });

    var ban = el('div', 'banner');
    ban.appendChild(el('div', 'deco', '🌿'));
    ban.appendChild(el('small', null, 'Cocina con lo que ya tienes'));
    ban.appendChild(el('h2', null, hasP ? (ready.length + (ready.length === 1 ? ' receta lista' : ' recetas listas') + ' para hoy') : '¿Qué hay en casa hoy?'));
    ban.appendChild(el('p', null, hasP ? (pcount() + (pcount() === 1 ? ' ingrediente marcado.' : ' ingredientes marcados.')) : 'Marca tus ingredientes y te digo qué puedes cocinar.'));
    var pill = el('button', 'pill', (hasP ? 'Editar lo que tengo' : 'Marcar lo que tengo') + ' →');
    pill.onclick = function(){ setTab('P'); };
    ban.appendChild(pill);
    box.appendChild(ban);

    // categorías
    var sec = el('div', 'sec'); sec.appendChild(el('h3', null, 'Por tipo de comida')); box.appendChild(sec);
    var cats = el('div', 'cats');
    ['D','C','L','E'].forEach(function(t){
      var c = el('button', 'cat');
      var circ = el('div', 'circ', TEMO[t]);
      circ.style.background = 'var(--t-' + t + ')';
      c.appendChild(circ);
      c.appendChild(document.createTextNode(TIPOS[t]));
      c.onclick = function(){ tipo = t; query = ''; $('q').value = ''; setTab('R'); };
      cats.appendChild(c);
    });
    box.appendChild(cats);

    function rail(title, list){
      var s = el('div', 'sec'); s.appendChild(el('h3', null, title));
      var a = el('a', null, 'Ver todas →');
      a.onclick = function(){ tipo = 'T'; query = ''; $('q').value = ''; setTab('R'); };
      s.appendChild(a);
      box.appendChild(s);
      var r = el('div', 'rail');
      list.slice(0, 12).forEach(function(x){ r.appendChild(miniCard(x, hasP)); });
      box.appendChild(r);
    }

    if(hasP){
      var readySorted = ready.slice().sort(function(a,b){
        var la = a.r.t === 'L' ? 1 : 0, lb = b.r.t === 'L' ? 1 : 0;
        if(la !== lb) return la - lb;
        if(a.s.total !== b.s.total) return b.s.total - a.s.total;
        return a.r.n.localeCompare(b.r.n, 'es');
      });
      if(readySorted.length) rail('Puedes hacer ya', readySorted);
      else {
        var sh = el('div', 'sec'); sh.appendChild(el('h3', null, 'Puedes hacer ya')); box.appendChild(sh);
        box.appendChild(el('div', 'hint', 'Con lo que marcaste todavía no se completa ninguna receta. Mira las que casi están listas.'));
      }
      var near = all.filter(function(x){ return x.s.total >= 3 && x.s.total - x.s.have === 1; }).sort(function(a,b){
        if(a.s.total !== b.s.total) return b.s.total - a.s.total;
        return a.r.n.localeCompare(b.r.n, 'es');
      });
      if(near.length) rail('Te falta poco', near);
    } else {
      var s0 = el('div', 'sec'); s0.appendChild(el('h3', null, 'Para empezar')); box.appendChild(s0);
      box.appendChild(el('div', 'hint', 'Cuando marques lo que tienes, aquí verás las recetas que ya puedes hacer.'));
    }

    var favList = all.filter(function(x){ return favs[x.r.id]; }).sort(compare(hasP));
    if(favList.length) rail('Tus favoritas', favList);

    // apariencia
    var sa = el('div', 'sec'); sa.appendChild(el('h3', null, 'Apariencia')); box.appendChild(sa);
    var tc = el('div', 'theme-card');
    tc.appendChild(el('p', null, 'Elige el tema de la app. Automático sigue el de tu teléfono o computadora.'));
    var tchips = el('div', 'chips');
    [['auto','Automático'],['light','☀️ Claro'],['dark','🌙 Oscuro']].forEach(function(o){
      var c = el('button', 'chip', o[1]);
      c.setAttribute('aria-pressed', theme === o[0] ? 'true' : 'false');
      c.onclick = function(){ setTheme(o[0]); };
      tchips.appendChild(c);
    });
    tc.appendChild(tchips);
    box.appendChild(tc);
  }

  // ---------- Recetas ----------
  function renderTipos(){
    var box = $('tipos');
    box.textContent = '';
    [['T','Todas'],['D','Desayuno'],['C','Comida'],['L','Colación'],['E','Cena']].forEach(function(p){
      var b = el('button', 'chip', p[1]);
      b.setAttribute('aria-pressed', tipo === p[0] ? 'true' : 'false');
      b.onclick = function(){ tipo = p[0]; renderTipos(); renderRecipes(); };
      box.appendChild(b);
    });
  }

  function renderRecipes(){
    renderTipos();
    var box = $('listR');
    box.textContent = '';
    var hasP = pcount() > 0;
    var nq = norm(query);
    var list = [];
    scored().forEach(function(x){
      var r = x.r;
      if(tipo !== 'T' && r.t !== tipo) return;
      if(nq){
        var hay = norm(r.n + ' ' + r.d + ' ' + r.g.map(function(g){ return g.map(function(i){return LAB[i];}).join(' '); }).join(' '));
        if(hay.indexOf(nq) < 0) return;
      }
      if(solo && hasP && x.s.have < x.s.total) return;
      list.push(x);
    });
    list.sort(compare(hasP));
    $('count').textContent = list.length + (list.length === 1 ? ' receta' : ' recetas');
    if(!list.length){
      box.appendChild(el('div', 'empty', (solo && hasP) ? 'Ninguna receta se puede hacer completa con lo que marcaste. Quita el filtro para ver las que casi te alcanzan.' : 'No hay recetas con ese filtro.'));
      return;
    }
    list.forEach(function(x){ box.appendChild(itemCard(x, hasP)); });
  }

  // ---------- Favoritas ----------
  function renderFavs(){
    var box = $('listF');
    box.textContent = '';
    var hasP = pcount() > 0;
    var list = scored().filter(function(x){ return favs[x.r.id]; }).sort(compare(hasP));
    $('countF').textContent = list.length + (list.length === 1 ? ' receta' : ' recetas');
    if(!list.length){
      box.appendChild(el('div', 'empty', 'Aún no tienes favoritas. Toca el corazón ♡ en cualquier receta para guardarla aquí.'));
      return;
    }
    list.forEach(function(x){ box.appendChild(itemCard(x, hasP)); });
  }

  // ---------- Lo que tengo ----------
  function updatePantryBar(){
    var n = pcount();
    $('pcount').textContent = n === 0 ? 'Marca lo que tienes en casa' : (n + (n === 1 ? ' ingrediente marcado' : ' ingredientes marcados'));
  }
  function renderPantry(){
    updatePantryBar();
    var box = $('listP');
    box.textContent = '';
    var nq = norm(qIng);
    var any = false;
    CATS.forEach(function(cat){
      var items = ING.filter(function(i){ return i.c === cat && (!nq || norm(i.l).indexOf(nq) >= 0); });
      if(!items.length) return;
      any = true;
      box.appendChild(el('h2', 'cat-h', cat));
      var chips = el('div', 'chips');
      items.forEach(function(i){
        var b = el('button', 'chip', i.l);
        b.setAttribute('aria-pressed', pantry[i.id] ? 'true' : 'false');
        b.onclick = function(){
          if(pantry[i.id]) delete pantry[i.id]; else pantry[i.id] = true;
          saveSet(KP, pantry);
          b.setAttribute('aria-pressed', pantry[i.id] ? 'true' : 'false');
          updatePantryBar();
        };
        chips.appendChild(b);
      });
      box.appendChild(chips);
    });
    if(!any) box.appendChild(el('div', 'empty', 'No encontré ese ingrediente.'));
    else {
      var go = el('button', 'pill', 'Ver recetas →');
      go.style.cssText = 'margin:26px 0 8px;background:var(--accent);color:var(--accent-ink)';
      go.onclick = function(){ setTab('R'); };
      box.appendChild(go);
    }
  }

  // ---------- Detalle ----------
  function openDetail(id){
    detailId = id;
    var r = BYID[id];
    var hasP = pcount() > 0, s = score(r);
    var d = $('detail');
    d.textContent = '';
    var head = el('div', 'd-head', emoji(r));
    head.style.background = 'var(--t-' + r.t + ')';
    var back = el('button', 'd-btn d-back', '←');
    back.setAttribute('aria-label', 'Volver');
    back.onclick = closeDetail;
    var fav = el('button', 'd-btn d-fav' + (favs[id] ? ' on' : ''), favs[id] ? '♥' : '♡');
    fav.id = 'dFav';
    fav.setAttribute('aria-label', 'Favorita');
    fav.onclick = function(){ toggleFav(id); };
    head.appendChild(back); head.appendChild(fav);
    d.appendChild(head);

    var sh = el('div', 'sheet');
    sh.appendChild(el('h1', null, r.n));
    var tags = el('div', 'tags');
    tags.appendChild(el('span', 'tag', TIPOS[r.t]));
    tags.appendChild(el('span', 'tag', 'Plan ' + r.p));
    var b = badge(s, hasP);
    if(b) tags.appendChild(b);
    sh.appendChild(tags);

    var stats = el('div', 'stats');
    function stat(v, l){ var x = el('div', 'stat'); x.appendChild(el('b', null, v)); x.appendChild(el('span', null, l)); stats.appendChild(x); }
    stat(String(s.total), s.total === 1 ? 'ingrediente' : 'ingredientes');
    stat(hasP ? String(s.have) : '–', 'que tienes');
    stat(hasP ? String(s.total - s.have) : '–', 'que te faltan');
    sh.appendChild(stats);

    sh.appendChild(el('h2', null, 'Ingredientes'));
    var ul = el('ul', 'ing');
    r.g.forEach(function(g){
      var ok = g.some(function(i){ return pantry[i]; });
      var li = el('li', hasP ? (ok ? 'y' : 'n') : '');
      li.appendChild(el('i', null, hasP ? (ok ? '✓' : '✗') : '•'));
      li.appendChild(el('span', null, g.map(function(i){ return LAB[i]; }).join(' o ')));
      ul.appendChild(li);
    });
    sh.appendChild(ul);

    sh.appendChild(el('h2', null, 'Porciones'));
    var por = el('div', 'por');
    var parts = r.d.split(' // ');
    parts.forEach(function(part, idx){
      var p = el('p');
      if(parts.length > 1) p.appendChild(el('span', 'lbl', idx === 0 ? 'Plato' : 'Para acompañar'));
      p.appendChild(document.createTextNode(part));
      por.appendChild(p);
    });
    sh.appendChild(por);
    d.appendChild(sh);

    d.classList.remove('hidden');
    document.body.classList.add('lock');
    d.scrollTop = 0;
  }
  function closeDetail(){
    detailId = null;
    $('detail').classList.add('hidden');
    document.body.classList.remove('lock');
  }

  // ---------- Navegación ----------
  function refresh(){
    if(tab === 'H') renderHome();
    else if(tab === 'R') renderRecipes();
    else if(tab === 'F') renderFavs();
    else renderPantry();
    if(detailId != null){
      var f = $('dFav');
      if(f){ f.className = 'd-btn d-fav' + (favs[detailId] ? ' on' : ''); f.textContent = favs[detailId] ? '♥' : '♡'; }
    }
  }
  function setTab(t){
    tab = t;
    closeDetail();
    var map = {H:'vH', R:'vR', F:'vF', P:'vP'};
    var nav = {H:'nH', R:'nR', F:'nF', P:'nP'};
    Object.keys(map).forEach(function(k){
      $(map[k]).classList.toggle('hidden', k !== t);
      $(nav[k]).setAttribute('aria-selected', k === t ? 'true' : 'false');
    });
    $('q').value = query;
    $('qi').value = qIng;
    refresh();
    try{ window.scrollTo(0, 0); }catch(e){}
  }

  $('nH').onclick = function(){ setTab('H'); };
  $('nR').onclick = function(){ setTab('R'); };
  $('nF').onclick = function(){ setTab('F'); };
  $('nP').onclick = function(){ setTab('P'); };
  $('goSearch').onclick = function(){ setTab('R'); try{ $('q').focus(); }catch(e){} };
  $('q').addEventListener('input', function(e){ query = e.target.value; renderRecipes(); });
  $('qi').addEventListener('input', function(e){ qIng = e.target.value; renderPantry(); });
  $('solo').addEventListener('change', function(e){ solo = e.target.checked; renderRecipes(); });
  $('clear').onclick = function(){
    if(!pcount()) return;
    if(confirm('¿Desmarcar todo lo que tienes?')){ pantry = {}; saveSet(KP, pantry); renderPantry(); }
  };
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && detailId != null) closeDetail(); });

  loadSet(KP, pantry);
  loadSet(KF, favs);
  applyTheme();
  setTab('H');

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
    });
  }
})();
</script>
</body>
</html>
